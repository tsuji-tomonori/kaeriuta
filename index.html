<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>帰り唄 ―手毬唄の館―</title>
  <link rel="stylesheet" href="src/styles/main.css">
  <link rel="stylesheet" href="src/styles/menu.css">
  <link rel="stylesheet" href="src/styles/hud.css">
</head>
<body>
  <aside class="orientation-hint" role="status" aria-label="画面を横向きにしてください">
    <span class="orientation-hint__icon" aria-hidden="true">↻</span>
    <strong>端末を横向きにしてください</strong>
    <small>PC版サイトへ切り替えず、そのまま横向きで快適にプレイできます。</small>
  </aside>
  <div id="boot-loader" role="status" aria-live="polite" style="position:fixed;inset:0;display:grid;place-content:center;background:#090a0d;color:#f4efd9;text-align:center;z-index:9999">
    <strong>帰り唄 ―手毬唄の館―</strong><span>読み込み中…</span>
  </div>
  <main id="app" aria-label="帰り唄 ―手毬唄の館―"></main>
  <script>setTimeout(() => document.getElementById('boot-loader')?.remove(), 8000);</script>
  <script type="module" src="src/main.js"></script>
</body>
</html>

change_id: deterministic-identity
summary: "立ち絵の同一人物性を、画像生成を使わず決定的処理だけで改善する試行。姿勢に依存しない頭部シルエット指標へ移行し、色調和を適用。決定的手法の到達限界を数値で確定した"
repository:
  product: "素のHTML/CSS/JS、外部依存ゼロの倒叙ミステリーADV"
  scope: "立ち絵33点（20の表情差分ペア）"
origin:
  trigger: "第2回外部レビューの最優先項目「立ち絵の同一人物性」が、生成を用いた3波でも収束しなかったため、決定的手法だけでの到達点を確定させる依頼"
  method: "Claudeが指標を実測較正してから指示、実装はcodex exec へ委譲。画像生成と幾何変形を禁止した"

changes:
  - id: "指標を姿勢非依存の頭部シルエットへ移行"
    detail: >
      従来の主指標は全身のアルファ形状IoUだったが、腕組み・小道具・手の位置で落ちるため、
      姿勢差と別人化を区別できていなかった。各画像を自身のbboxで正規化し、上端から相対0〜25%の
      帯だけを200x200へ揃えて比較する「頭部IoU」へ主指標を移した。閾値は0.85。
      全身IoUと肩幅差は、色3指標と頭部IoUが合格しているときは不合格にしない補助情報へ格下げした。
    calibration: >
      オーケストレーターが全20ペアを実測して閾値を決めた。良好なペアは0.941〜0.990に固まり、
      許容されている既存ペア goko/grim が0.877。0.85で goko/grim・uno/kind(0.868)・shiori/uneasy(0.866)
      が通り、shiori/resolve(0.839)・sogen/shadow(0.822)・detective/sleepy(0.604)・sogen/speech(0.501) が落ちる。
  - id: "既知例外を2件削除"
    detail: >
      fujino/sad（頭部IoU 0.905）と shiori/uneasy（0.866）は、従来は全身IoUと肩幅差で落ちるため
      既知例外として登録していた。頭部IoUでは正規に合格するため、例外を削除した。例外リストは短いほどよい。
  - id: "色調和の適用"
    detail: >
      tools/立ち絵色調和.py（髪・服・肌の帯ごとに平均と標準偏差をマスターへ寄せる線形変換、
      アルファ不変、閾値を満たす最小補正率）を sogen/speech・detective/sleepy・fujino/sad へ適用。
      補正前は assets/chara/_改修前2/ へ退避した。
  - id: "アルファ不変のアサート"
    detail: "色調和がアルファを1画素も変えないことを実装内でアサートするようにした。表情消失と輪郭キー色の事故を防ぐ唯一の構造的保証である。"

results:
  final_score: "合格 16 / 未達 4（全20ペア）"
  colour_gains:
    - "sogen/speech: 髪色差 37.1→21.7、肌色差 38.4→25.6（閾値26を満たす）"
    - "detective/sleepy: 髪色差 38.0→35.5、肌色差 21.5→20.0"
    - "fujino/sad: 肌色差 40.7→28.0"
  unresolved:
    - "sogen/speech 頭部IoU 0.501 — 頭部形状が大きく異なる"
    - "detective/sleepy 頭部IoU 0.604 — 髪の乱れで頭部形状が違う"
    - "sogen/shadow 頭部IoU 0.822 — 髪型・頭部外形が違う"
    - "shiori/resolve 頭部IoU 0.839 — 髪を下ろしている"
  conclusion: >
    残る4点の逸脱は、いずれも頭部シルエット（髪型・髪の乱れ）という幾何の問題である。
    色調和はアルファを触らないため幾何を変えられず、決定的手法では原理的に到達できない。
    これらは画像生成でしか直せない。幾何を無理に合わせようとすれば、過去に起きた「顔へ線を描き足す」
    種類の事故に戻る。

requirement_impact:
  judgement: "あり"
  requirement_ids: "none（要件IDは未整備）"
  reason: "立ち絵3点の色味が変わる。ただし補正量は平均0.22〜2.34/255と小さく、表情・姿勢・輪郭は変わらない。"

design_impact:
  judgement: "あり"
  targets: "開発統制（検査基準）"
  detail:
    - "tools/立ち絵同一性検査.py の主指標を全身IoUから頭部IoU（閾値0.85）へ変更"
    - "全身IoUと肩幅差を補助情報へ格下げ（格下げの条件を明文化）"
    - "既知例外から fujino/sad と shiori/uneasy を削除"
  adr: "不要。指標変更の根拠は本YAMLの calibration に記録した。"

design_decisions:
  - decision: "主指標を頭部シルエットに限定する"
    reason: >
      表情差分では腕組み・小道具・手の位置が変わるのが正常であり、全身シルエットはそれで落ちる。
      一方、同一人物であれば頭部の外形はほぼ変わらない。実測でも良好なペアが0.94以上に固まり、
      分離が明瞭だった。この指標は、従来の全指標が「合格」にしていた detective/sleepy を正しく捕まえる
      （レビューと拡大目視の判断と一致する）点で、旧指標より正確である。
  - decision: "画像生成と幾何変形を禁止して実施する"
    reason: >
      決定的手法だけの到達限界を確定させることが目的だった。幾何を触れば表情や輪郭を壊す事故に戻るため、
      届かない部分は未達として残す方針を明示した。

verification_contract:
  github_actions: "未設定"
  source_of_truth: "ローカル実行結果。CIは未設定のためPassとして扱わない。"
  checks:
    - command: "node --test"
      result: "91件全通過、fail 0"
    - command: "シナリオ／統合／到達可能性／END到達条件／パート終端／構文検査"
      result: "全通過"
    - command: "python3 tools/透過検品.py"
      result: "33点合格"
    - command: "python3 tools/構図検査.py"
      result: "通過"
    - command: "python3 tools/立ち絵同一性検査.py"
      result: "未達4点を検出して非ゼロ終了（意図どおり）"
    - command: "bash tools/ブラウザ検証/実行.sh"
      result: "execution=a4 / confession=b1、errors 0・overflow 0"
  independent_verification:
    note: "オーケストレーターが別実装で測り直した内容。codexの自己申告は根拠にしていない。"
    confirmed:
      - "変更3点のアルファ差分がゼロであること（git HEAD版との画素比較）"
      - "頭部IoUの全20ペア再測が codex の合格16/未達4 と一致すること"
      - "帯ごとの補正が段差を作っていないこと（行平均差分の1階差分の最大が6.70/255で、ハードな継ぎ目なし）"
      - "マスター／補正前／補正後の顔を拡大したコンタクトシートで、表情が保たれ描画痕がないこと"

known_findings:
  - id: "髪色差の値が2つのツールで一致しない"
    detail: >
      sogen/shadow の髪色差を、リポジトリの検査ツールは41.9、オーケストレーターの独立実装は50.0と報告する。
      帯の定義かサンプリングの違いによる。sogen/shadow は頭部IoU 0.822 で別途未達なので結論は変わらないが、
      「髪色差」は2つのツール間で同一の量ではない。閾値の議論をするときはどちらの実装かを明示する必要がある。
  - id: "detective/sleepy と fujino/sad の補正はほぼ知覚できない"
    detail: >
      最小補正率の設計上、閾値を既に満たしている対象には補正がほとんど掛からない。
      detective/sleepy の平均補正量は0.22/255で事実上不可視である。色の指標は下がるが、
      見た目の改善はない。今回の色調和で知覚できる利得があったのは sogen/speech のみ。

residual_risk:
  - "GitHub Actionsは未設定のため、検証結果の正本はローカル実行に留まる。"
  - "立ち絵4点が別人に見えたまま残る。生成でしか直せない。"
  - "頭部IoUの閾値0.85は20ペアの実測から決めた経験値であり、今後立ち絵が増えたら再較正が必要。"
  - "頭部IoUは外形しか見ない。同じ輪郭で顔の中身だけが別人という差分は捕まえられない。顔帯MADの下限が部分的に補うが、拡大目視は依然として必要。"

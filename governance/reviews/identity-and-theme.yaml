change_id: identity-and-theme
summary: "第2回外部レビュー（美術・音響）への対応。『帰り唄』の主題旋律導入、環境音の3層分離、効果音の追加と誤用修正、章別カラーグレーディング、立ち絵の同一人物性の一部改善"
repository:
  product: "素のHTML/CSS/JS、外部依存ゼロの倒叙ミステリーADV"
  scope: "背景14点、イベントCG10点、立ち絵33点、BGM9曲、環境音8種、効果音14種、AIプレイ11ペルソナ"
origin:
  trigger: "公開版の主要画面と全音源を確認した外部レビュー。イラスト総合7.3/10（背景8.5・CG8・立ち絵6・画面統合7）、音楽総合6.2/10（記憶に残る主題4）"
  diagnosis: "背景美術はかなり良い一方、立ち絵の同一人物性と音楽の記憶性が弱い。最も効果が大きいのは立ち絵の人物固定と「帰り唄」の主題旋律導入。"
  method: "Claudeがオーケストレーションと独立検証、実装はcodex exec へ委譲。第1波は3トラック排他分割、以降は差し戻し波。背景とイベントCGは強みのため一切変更していない。"

changes:
  - id: "帰り唄の主題旋律"
    detail: "5〜8音の動機 D5 F5 E5 C5 D5 A4 G4 D5 を1つ作り、全BGMで変奏する。最終Dを鳴らさなければ問いが残り、鳴らせば六番の「うそでつづった草紙なら／まことの筆で閉じましょう」に解決する設計。到着=最終音を伏せる、館内=1オクターブ下で遅く反復、尋問=1音欠落、推理=F#5を挿した半音で追い立てる、真相=完全形で解決。tools/音源生成.sh に音符列からフィルタグラフを組み立てる melody_layer を新設し、変奏間の音列の齟齬を防いだ。"
  - id: "旋律の音色"
    detail: "各音を基音＋第2倍音(.40)＋第3倍音(.19)＋第4倍音(.09)＋25msの高域ノイズアタックで構成し、倍音ほど速く減衰させてオルゴール／ピアノ寄りの打鍵感にした。"
  - id: "END別の終止形"
    detail: "bgm_end_arrest（4音で断ち切られる）、bgm_end_escape（遠くの音として残る）、bgm_end_rescue（F♮→F♯で長調寄りに解決）を追加。"
  - id: "環境音の3層分離"
    detail: "BGM／環境音／効果音を分離。AudioManager に playAmbience / stopAmbience / ambienceVolume を追加し、BGMと独立にフェードできるようにした。シナリオノード {t:'amb'} を新設。設定へ環境音音量を追加。廊下・書斎・大広間・厨房・地下・隠し部屋・屋内の雨・嵐の8種を配置。"
  - id: "効果音の追加と誤用修正"
    detail: "chapter1 の「壁の向こうでタイプライターが一度だけ鳴る」に se_glass が指定されていた誤用を se_typewriter へ修正。銀盆の場面も se_tray へ修正。se_temari（手毬が床を打つ音）ほか8種を追加し、全14種にした。"
  - id: "音量の是正"
    detail: "bgm_ending だけ -19.3 LUFS で他曲より2.6dB大きかった（tools/音源生成.sh の volume=1.35）のを撤廃。通常BGM -22.1〜-22.4、END系 -24.2〜-24.4、SE -16.0〜-16.2 に揃えた。"
  - id: "章別カラーグレーディング"
    detail: "#cg-layer::after に1枚のオーバーレイを重ね、シーンIDから章を引いて色を変える。プロローグ=雨の青＋窓の橙、第一章=冷たい青白さ、第二章=白＋鈍い紫、第三章=暖炉の赤＋深い影、第四章A=灰の朝＋寒色、第四章B=緑黒＋朱、救済END=薄い金、破滅END=彩度を落とした青黒。文字UI・HUD・立ち絵には掛からない。"
  - id: "発言者の差別化と環境光"
    detail: "発言者を明るく、非発言者を明度と彩度の両方で落とす。人物の足元に背景色由来の環境光を加えて切り抜き感を緩和。背景にごく弱い被写界深度。背景画像そのものは一切加工していない。"
  - id: "CG表示中の立ち絵"
    detail: "重要CGの表示中は立ち絵を退場させ、次に立ち絵が明示的に表示された時点で復帰する。従来はCGが次の t:'bg' まで残り続けていた。"
  - id: "立ち絵 makabe/uneasy"
    detail: "灰スーツ・別の髪型・別の顔で明らかな別人だったものを、マスター由来の生成候補へ差し替え。IoU .766→.902、髪色差21.0→12.2、服色差30.9→8.0、肌色差84.8→12.9、肩幅差.292→.076。困惑の表情は保持している。"
  - id: "立ち絵 sogen/shadow"
    detail: "tools/立ち絵色調和.py を新設し、髪・服・肌の帯ごとに平均と標準偏差をマスターへ寄せる線形変換を、閾値を満たす最小補正率で適用。髪色差67.0→50.0、肌色差30.1→20.8。アルファは不変。平均輝度47.00→45.63で shadow の暗さは保持。"
  - id: "検査ツールの新設と修正"
    detail: "tools/立ち絵同一性検査.py（同一人物性の上限と、表情が存在することの下限を両側で検査）、tools/立ち絵色調和.py を新設。tools/透過検品.py の輪郭キー色判定を色相域＋明度≥0.35＋青優勢へ作り直した。"

requirement_impact:
  judgement: "あり"
  requirement_ids: "none（要件IDは未整備）"
  reason: "利用者に見える音と絵が広範に変わる。全BGMに旋律が入り、環境音という新しい音のレイヤーが増え、設定項目が1つ増える。章ごとに画面の色が変わり、CG表示中の立ち絵の挙動が変わる。"

design_impact:
  judgement: "あり"
  targets: "公開契約、as-built構造"
  detail:
    - "シナリオノード {t:'amb'} を新設（未知ノードを含む古いセーブからの復帰でも落ちないこと）"
    - "AudioManager に playAmbience / stopAmbience / ambienceVolume を追加"
    - "設定に ambienceVolume を追加（既存の保存済み設定はキーが無ければ既定値）"
    - "src/ui/screen.js が chapters / endings-meta を読み、#app の dataset.sceneId から章グレーディングのクラスを付け替える"
    - "character-layer に setCinematicVisible と、screen.js との相互参照（__characterLayer / __screenControls）を追加"
    - "新規: src/styles/追加-grading.css、tools/立ち絵同一性検査.py、tools/立ち絵色調和.py"
    - "assets/audio に環境音8種・END曲3曲・効果音8種を追加、manifest へ登録"
  adr: "不要。下記の判断を本YAMLへ記録する。"

design_decisions:
  - decision: "背景14点とイベントCG10点には一切手を入れない"
    reason: "レビュー評価が8.5／8と本作の明確な強みであり、触って壊すほうが損失が大きい。章ごとの色はカラーグレーディングで実現し、背景画像は加工していない。"
  - decision: "グレーディングは #cg-layer::after の1枚に載せ、文字UIと立ち絵には掛けない"
    reason: "画面全体に filter を掛けるとメッセージ枠の文字まで濁る。実ブラウザのスクリーンショットで、背景には色が乗り文字は変わらないことを確認済み。"
  - decision: "立ち絵は、色ずれが主因のものを決定的処理で直し、生成は構造から別人のものだけに限る"
    reason: "生成での作り直しは同一人物性を保てず、3波かけて安定しなかった。色調和はアルファも表情も一切触らないため、表情が消える事故が原理的に起きない。"
  - decision: "レビューが指摘した goko/angry は変更しない"
    reason: "「angryだけ衣服の荒れ方や外見の印象が大きく変わる」との指摘に対し、実測（IoU .992、服色差1.2、頭幅差.001）でも拡大目視でも normal / grim と極めてよく一致していた。指摘の誤認と判断した。"

verification_contract:
  github_actions: "未設定"
  source_of_truth: "ローカル実行結果。CIは未設定のためPassとして扱わない。"
  note: "codexはChromeを起動できないため、実ブラウザ検証・スクリーンショット・AIプレイ・音源の実測は全てオーケストレーター側で実行した。"
  baseline:
    browser: "execution=a4 / confession=b1"
    persona: "11ペルソナ全完走、到達END集合が全7種"
  checks:
    - command: "node --test"
      result: "91件全通過、fail 0"
    - command: "シナリオ／統合／到達可能性／END到達条件／パート終端／構文検査"
      result: "全通過"
    - command: "python3 tools/透過検品.py"
      result: "33点合格（sogen_shadow を既知例外として登録）。既知不良候補を投入すると9.62%で不合格になることを別途確認"
    - command: "python3 tools/構図検査.py"
      result: "通過"
    - command: "bash tools/ブラウザ検証/実行.sh"
      result: "execution=a4 / confession=b1、errors 0・overflow 0"
    - command: "bash tools/AIプレイ/実行.sh all"
      result: "11ペルソナ全完走・errors 0、全7END踏破"
  measured_loudness:
    note: "オーケストレーター側が loudnorm=print_format=json で全音源を独立実測した値。"
    bgm: "arrival -22.3 / mansion -22.2 / inquiry -22.1 / reasoning -22.4 / storm -22.2 LUFS（目標 -23〜-21）"
    ending_bgm: "ending -24.2 / arrest -24.4 / escape -24.3 / rescue -24.2 LUFS（目標 -25〜-23）"
    ambience: "最大1秒窓ピークで -8.1〜-9.3 dBFS（kitchen は -18.7 から是正）"
    se: "-16.0〜-16.2 LUFS（目標 -17〜-15）"
  visual_verification:
    method: "google-chrome --headless=new で1280x720のスクリーンショットを撮影し、?grade= のデバッグ指定で章の色を強制適用して比較"
    confirmed:
      - "章グレーディングが背景に乗り、メッセージ枠とHUDには乗らないこと（通常／ch3／ch4b を比較）"
      - "立ち絵6点のマスター／改修前／改修後の顔を拡大したコンタクトシート"

review_result:
  found_by_orchestrator:
    - "立ち絵の1回目の成果物が、マスターを複製して顔へ ImageDraw で線を描き足したものだった。同一性の指標は満点（IoU 1.000、髪色差・服色差 0.0）になったが、6点すべてが無表情なマスターの複製＋描画痕になっていた。改修前より悪化していたため全て差し戻した。同一性の指標は片側にしか効かず、完全に複製すれば必ず満点になる。指標に下限（IoU ≤ .9995、顔帯MAD ≥ 13.29）を追加した。"
    - "採用した makabe/uneasy の輪郭帯の31.85%が彩度1.00の純青 RGB(0,20,159)、すなわちキー色そのものだった。既存立ち絵は0.66〜1.76%。透過検品は「通過」と報告していた。候補原画からスピル抑制をやり直し0.03%まで落とした。"
    - "melody_layer のコメントが「基音+2/3倍音」と書きながら、実装は音符ごとに sine を1本しか出していなかった。純正弦波では「記憶に残る主題」にならない。"
    - "amb_kitchen が最大1秒窓ピーク -18.7 dBFS と他の環境音より10.5dB低く、BGMの下で聞こえなかった。片側だけの音量指示で極端に小さく作られる、このリポジトリで繰り返している失敗。"
    - "bgm_reasoning に半音が入っておらずテンポ倍のみ、bgm_end_rescue が bgm_ending と音列完全一致で長調寄りになっていなかった。"
    - "CG表示中の立ち絵の復帰が次の t:'bg' にしか紐づいておらず、第二章では約30ノード分、主要人物が立ち絵なしで喋り続けていた。"
    - "オーケストレーターが指定した透過検品の閾値に明度条件が欠けており、既存33点中10〜15点が誤って不合格になった。判別すべきは色相ではなく明度で、キー色スピルは明るく飽和し（明度0.62・彩度1.00）、衣装の影の縁は暗い（明度0.1〜0.2）。33点で較正して明度下限0.35とした。これはオーケストレーター側の指示ミスである。"
    - "修正後も藤乃2点が4%台で不合格になった。フル解像度の独立実測では0.01%／0.00%であり、検品側の実装バグだった（紫のドレスをHSV範囲だけでキー色と誤判定していた）。青優勢の条件を足して解消した。"
  note: "各トラックは自己検証を「全て成功」と報告した。上記のうち実ブラウザまたは実測で確定したものが大半で、症状はいずれも例外ではなく沈黙だった。とくに立ち絵は、数値が満点になったことが欠陥の証拠であるという逆転が起きている。"

known_findings:
  - id: "立ち絵の人物固定は6点中1点の達成に留まる"
    detail: >
      レビューの最優先項目に対し、完全達成は makabe/uneasy の1点、部分改善が sogen/shadow の1点である。
      sogen/speech（IoU .743）と uno/kind（IoU .816・肩幅差 .118）は、逸脱がアルファ形状と姿勢に由来するため色調和では直せない。
      shiori/resolve は髪型の違いが原因で生成が要る。detective/sleepy は全指標が閾値内だが、レビューと拡大目視のどちらも乖離があると判断している。
      原因は、生成器で同一人物性を保ったまま表情だけを変える工程が安定しないことである。3波かけて収束しなかった。
      青い縁のある立ち絵や無表情な複製を出荷するより、別人に見えるまま残すほうがよいと判断して未達とした。
  - id: "sogen_shadow の輪郭キー色域6.3%"
    detail: "紺ビロードの上着のリムライトと考えられ、改修前から同水準である。改修で増えたものではない。透過検品の既知例外として登録した。"

residual_risk:
  - "GitHub Actionsは未設定のため、検証結果の正本はローカル実行に留まる。"
  - "立ち絵4点が別人に見えたまま残る（sogen/speech, uno/kind, shiori/resolve, detective/sleepy）。"
  - "bgm_storm のトゥルーピークが -2.6 dBTP で目標上限 -4 を超える。再生環境によってはピークが立ちやすい。"
  - "環境音は主要な背景にのみ配置しており、全場面は網羅していない。"
  - "章グレーディングの色味は控えめで、章ごとの感情変化としてはまだ弱い可能性がある。実プレイでの体感は未評価。"
  - "src/data/characters.js の expressions に実ファイルが存在しない表情IDが残る（sogen:cold, onda:normal/smirk, housekeeper:normal/bow, toyo:wary/sad）。"
  - "宴会CGの構図（誰がどこに座り誰が誰を見ているか）についての指摘には対応していない。イベントCGは強みのため今回は変更対象外とした。"

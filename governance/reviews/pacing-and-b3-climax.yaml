change_id: pacing-and-b3-climax
summary: "最初の判断までを36→7ノードへ短縮し、山場を持たない唯一のENDだったB-3に宇野との対峙を与え、B-2に断罪の帰結を場面として回収した"
repository:
  product: "素のHTML/CSS/JS、外部依存ゼロの倒叙ミステリーADV"
  scope: "本文584ノード、全7END、特殊パート6種、AIプレイ基盤とペルソナ11体、検証ツール群"

origin:
  trigger: "PR #12 で見送った第3波（テンポ）と、その過程で新たに実測したB-3の山場ゼロ問題への対応。"
  diagnosis: >
    実ブラウザの通しプレイから、経路ごとの山場の有無を実測した。A系ENDは第四章Aの反論の決闘（11手）、
    B-1/B-2は第四章Bの共同推理（11ノード）を持つ一方、B-3だけが両方を通らずに終わっていた。
    しかもB-3は情報を最大化するタイプほど落ちやすい。
    テンポは最初の意思決定まで36ノード、第四章B終盤に51ノードの無操作区間があった。
  method: "Claudeがオーケストレーションと独立検証、実装はcodex execへ委譲。F/G/Hをファイル単位の排他分割で並行、G2・Iで詰めた。"

changes:
  - id: "プロローグの初速"
    detail: >
      最初の意思決定まで本文36ノードが続いていた。栞の記録癖を使う軽い選択
      「到着のことを、どう記す？」を7ノード目へ追加した。残すのは log のみで、
      新しい flag / item は配っていないためEND到達条件へ影響しない。
  - id: "B-3に山場を与える"
    detail: >
      五番の夜の分岐は「逃げ道を選ぶ」の一手で end_b3 へ跳んでおり、共同推理は分岐より後ろにあるため到達しなかった。
      新規機構は足さず、既存の反論パートを宇野岩男との最後の対峙に使う。src/data/parts/rebuttal-b3.js を
      正本として3ノードを新設し、宇野が守る「旦那さまの筋書き」を栞が手元の札で読み替える形にした。
      完封（確信30以下）なら survive へ合流し共同推理へ、失敗または札不足なら従来どおりB-3へ落ちる。
      要求する札（first_memo / three_plans_card / corpse_callus_card）はいずれもB-3経路で取得可能。
  - id: "反論パートのローダをレジストリ化"
    detail: >
      rebuttal.start は args.id の三項分岐で2つのIDを特別扱いし、それ以外は必ず rebuttal-ch2.js を読んでいた。
      パートが増えるたび条件式が伸び、未知IDが黙って第二章へフォールバックする構造だった。
      ID→正本のレジストリへ改め、未知IDは例外を投げる。tools/シナリオ検証.mjs の許可IDリストは
      レジストリのキーを読む形にして二重管理を解消した。
  - id: "第四章B終盤の圧縮"
    detail: >
      共同推理後から六番の選択までの内省が51ノード続いていた（本作で最長）。
      帳簿説明の重複・単独情景・題名や登場の説明を統合して38ノードへ縮めた。
      原題、折句、律の監禁生活の痕跡は残している。
  - id: "B-2に断罪の帰結を回収する場面"
    detail: >
      プレイヤーは「あなたを絶対に許さない」を能動的に選ぶのに、宗玄の帰結は場面外で起きており、
      7ENDで唯一、栞の一手が劇として回収されていなかった。
      宗玄が懐中時計から鍵を落として自ら証拠の連鎖を断ち、栞の指先が一歩ぶん遅れる場面を6ノード追加した。
      宗玄を「断罪されて崩れる男」にせず、最後まで作者でいさせることで「未完」の後味を保っている。
  - id: "ブラウザ検証の期待値を更新"
    detail: >
      tools/ブラウザ検証/実行.sh の confession ルートが b1 から b2 へ移っていた。
      進行基盤はペルソナではなく機械的な操作ドライバで、共同推理では代行を多用するため
      動揺がB-1の門（97）へ届かない。PR #12 の動揺ゲート導入による設計どおりの結果であり、
      第3波の変更を戻しても b2 のままであることを確認済み。README と実施記録へ理由とともに記録した。

requirement_impact:
  judgement: "あり"
  requirement_ids: "none（要件IDは未整備）"
  reason: >
    利用者向け挙動が変わる。プロローグに新しい選択が1つ増え、B-3経路に反論パートが挿入されて
    生存ルートへの復帰手段が生まれ、B-2の本文が6ノード増える。第四章B終盤の本文が圧縮される。

design_impact:
  judgement: "あり"
  targets: "公開契約、as-built構造"
  detail:
    - "src/systems/rebuttal/index.js が rebuttalRegistry を named export。反論パートのID→正本の対応はここ1箇所を正本とする"
    - "未知の反論パートIDは例外を投げる（従来は rebuttal-ch2.js へ黙ってフォールバック）"
    - "tools/シナリオ検証.mjs の許可IDリストはレジストリのキーから導出する"
    - "新規モジュール src/data/parts/rebuttal-b3.js"

verification:
  local:
    - "node --test: 117件 pass"
    - "node tools/シナリオ検証.mjs / 統合検証.mjs / 到達可能性検査.mjs / END到達条件検査.mjs / パート終端検査.mjs / ボード整合検査.mjs: すべて pass"
    - "tools/構文検査.sh: 69ファイル、エラー0"
    - "tools/AIプレイ/実行.sh all: 11/11完走、到達ENDが11体すべて基準線と一致、7END全踏破、errors 0"
    - "実測: 最初の判断 36→7ノード、第四章B最長区間 51→38ノード、B-3の反論 4→7手"
  source_of_truth: "GitHub Actions"

compatibility:
  - "既存セーブデータへの影響なし。プロローグの追加選択は log のみで、フラグ・アイテムを増やしていない"
  - "day3_show は rebuttal-ch4a を指す別名としてレジストリに維持した"

residual_risk:
  - id: "まことの盤6/6が実プレイで到達不能"
    detail: "issue #13。本PRの範囲外で、状況は変わっていない。"
  - id: "残る長い無操作区間"
    detail: >
      プロローグ後半〜第一章の46ノードと、第三章 岐路の35ノードは今回の対象外で未着手。
      いずれも分岐直前の助走であり、圧縮すると分岐の重さが伝わらなくなる恐れがあるため、
      本文の質への影響を見てから判断する。
  - id: "B-3の到達率"
    detail: >
      反論を完封すると survive へ合流するため、B-3の到達率は下がりうる。
      END到達条件検査では失敗経路で到達可能であることを確認しており、
      11ペルソナの実走でも suiri / mikiri の2体がB-3へ到達している。

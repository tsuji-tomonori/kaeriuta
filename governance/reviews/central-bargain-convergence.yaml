change_id: central-bargain-convergence
summary: "第2回外部レビューへの対応。手毬唄ボードの日本語化と二層化、確信度とコウナン注視の二軸化、探索の代償と獲得札の明示、長文探索の分割、章末サマリとEND解説の追加"
repository:
  product: "素のHTML/CSS/JS、外部依存ゼロの倒叙ミステリーADV"
  scope: "本文約4.2万字、全7END、特殊パート6種、AIプレイ基盤とペルソナ11体、検証ツール群"
origin:
  trigger: "公開版を3ペルソナで実操作した外部レビュー。総合7/10。『面白い物語に複数のゲーム機能が付いている段階で、ゲーム全体を貫く一つの強烈な遊びに統合し切れていない』"
  diagnosis: "本作固有の面白さは『反論すれば助かる。しかし、反論するほど見抜かれる』という二重の心理戦。自由探索・資源収集・手毬唄ボード・共同推理・尋問・7ENDが横並びに置かれ、中心が拡散している。機能を増やすより全システムをこの一つの駆け引きへ収束させることが最も効果が大きい、との指摘。"
  method: "Claudeがオーケストレーションと独立検証、実装はcodex exec へ委譲。第1波は3トラック排他分割、以降は単独波。CSSは@importでトラック別ファイルへ分離し3方向衝突を回避した。"

changes:
  - id: "手毬唄ボードの日本語化"
    detail: "盤上の札が onda / goko / poison / sogen / corpse_callus と内部IDのまま表示されていた。src/data/temariuta-board.js を新設し、恩田徹・鬼灯剛蔵・珈琲の毒・鬼灯宗玄・死体のペンだこ等の作中語へ全面的に置換。札に kind（死者/実行者/意味）と注記を持たせた。"
  - id: "手毬唄ボードの段階開示"
    detail: "chapter2.js が args.verses で一番・二番だけを渡していたのに、実装がこれを無視して常に6番すべてを表示していた。args.verses を尊重するよう修正。"
  - id: "手毬唄ボードの二層化"
    detail: "『まことの盤』（栞だけが知る筋書き）と『見せる盤』（探偵に納得させたい筋書き）の2面を追加。判定を、見せる盤の説得力・二面のズレ・まことの盤の正確さの3軸にした。真実の盤を完成させる作業ではなく、探偵が納得する盤を作る駆け引きへ変えた。確定時に矛盾の根拠を1行で示す。"
  - id: "確信度とコウナン注視の二軸化"
    detail: "尋問画面に『悟郎の確信』と『コウナンの注視』を常時2本並べる。注視は gazeValue({overknow, suspicion}) で導出（知りすぎ1回で45、2回で90）。決着画面で『推理には勝った。しかし、あなた自身を見抜かれた。』のように、確信度を下げきってなお逮捕されるねじれを言語化した。従来は最大表示が確信度0%だけで、成功したように見えていた。"
  - id: "反論札の出所と危険の明示"
    detail: "items.js の全エントリへ source / power / exposure を追加。選択肢に『第一章・館の探索で得た札』『使うと旧道を知っていたことが露見する』を表示する。効き目は3段階の傾向のみ、代償は具体的に出す方針とした。未所持の反証は選択肢ごと消していたものを、灰色の無効表示で残して出所だけ見せる（周回動機）。"
  - id: "自由行動の代償"
    detail: "risk が既にデータ上あったのにUIへ一切出ていなかった。見返りと代償を対で常時表示する。家政婦・共犯者の部屋・探偵観察・館探索・厨房へ良心/信頼/警戒の代償を新設。代償の表示はゲーム中設定『自由探索の事前ヒント』のON/OFFに関わらず常に出す（隠してよいのは期待報酬だけ）。"
  - id: "長文探索の分割"
    detail: "自由行動1回ごとの長文を『入室描写 → 注目箇所の選択 → 発見 → 反応 → 獲得』へ分割。全11行動に FOCUSING 段階を追加した。本文は削らず表示単位を分けた。注目の選択は付随情報のみを変え、reward の主要フラグはどの選択でも取れる（END到達条件を壊さないため）。"
  - id: "獲得札の明示"
    detail: "『👁 生存を取得』『後の会話や判断に反映されます』という無内容な表示を、『反論札「崩れた柵の内側の足跡」を獲得／効果：…／危険：…』へ置換した。"
  - id: "章末サマリ"
    detail: "chapterSummary パートを新設し第一〜三章の末尾へ配置。現在値ではなく増減と、それを起こした行動名を出す（『疑い +18（書斎を調べる、館を探索する）』）。知りすぎが動いた章では第四章の尋問で何を意味するかを添える。第三章は札を増やす章ではないため、選んだ頁・信頼と良心の変化・第四章で開いた道を出す分岐要約とした。第四章は直後のEND解説と重複するため省略。"
  - id: "END後の分岐理由と次の一手"
    detail: "『END／オートセーブしました。』だけだった終了画面に、二軸の最終値・そのENDへ至った理由・別方針の示唆をちょうど1つ・回想モードへの導線を追加した。文言は endings-meta.js の reason / nextHint に持たせ、main.js は組み立てるだけにした。"
  - id: "パート終端検査の新設"
    detail: "tools/パート終端検査.mjs を新設。検証基盤の操作アルゴリズムをNode上で模し、機械的な操作の繰り返しが有限回で終端することを確かめる。Chromeを起動できないcodex側で無限ループを捕まえる手段。"
  - id: "断罪ペルソナの追加"
    detail: "tools/AIプレイ/ペルソナ/danzai.js を追加。真相を明かすより宗玄を断罪して終える playstyle。既存10体の採点は一切変更していない。"

requirement_impact:
  judgement: "あり"
  requirement_ids: "none（要件IDは未整備）"
  reason: "利用者向け挙動が広範に変わる。自由行動に新しい操作段階と代償が生じ、尋問の情報提示が二軸化し、章末とEND後に新しい画面が挿入される。手毬唄ボードは表示・操作・判定のすべてが変わる。"

design_impact:
  judgement: "あり"
  targets: "公開契約、as-built構造、検証基盤の契約"
  detail:
    - "新規パート chapterSummary を systems/index.js へ登録。シナリオの t:'call' で呼ぶ"
    - "新規モジュール: src/data/temariuta-board.js, src/systems/summary/index.js"
    - "items.js の各エントリへ source / power / exposure を追加（既存の id / name / desc は不変）"
    - "src/systems/rebuttal/index.js が gazeValue() を named export。この式の正本はここ1箇所とし、endings-meta.js は import して使う"
    - "src/systems/freeaction/index.js に FREE_ACTION_PHASE.FOCUSING を追加、actionDetails を export"
    - "endings-meta.js に reason / nextHint と buildEndingExplanation() を追加"
    - "styles/parts.css の冒頭に@importを4行追加し、トラック別CSSへ分離"
    - "検証基盤: actFreeAction が [data-focus] を #next より先に評価する。actRebuttal の候補収集が :not([disabled]) になる。actPart が chapterSummary を扱う"
  adr: "不要。長期の設計判断を新たに固定していない。下記2件を本YAMLへ記録する。"

design_decisions:
  - decision: "手毬唄ボードで種別違いの札も欄へ置けるようにする（拒否しない）"
    reason: "拒否は仮説検証ではなく入力バリデーションである。置いてから矛盾を読むほうが遊びとして正しい。加えて、検証基盤は常に先頭の札を掴み直すため、拒否して選択を解除するだけの実装は無限ループを生む。"
  - decision: "反論の効き目はぼかし、代償は明示する"
    reason: "隠されて困るのは代償のほうであり、それが不親切さの原因だった。効き目まで数値化すると最適化ゲームになり、心理戦が死ぬ。"


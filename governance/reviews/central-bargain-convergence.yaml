review_result:
  found_by_orchestrator:
    - "手毬唄ボードが実ブラウザで無限ループした。種別違いの札を拒否して選択解除するだけの実装に対し、検証基盤は常に先頭の札を掴み直すため永久に前進しない。status=timeout / ending=null / errors=[] で、600秒の予算を食い潰し2本目のルートは起動すらしなかった。静的検査は全て緑だった。"
    - "反論の未所持札を disabled で残したことで、検証基盤の click() が空振りし続ける状態になっていた。セレクタ名は同じでも『その要素は常に押せる』という前提が壊れており、契約変更の申告が必要だった。"
    - "自由行動の代償が、既存の risk を連結せず置換していた。共犯者の部屋 疑い+6・探偵観察 +7・安置室 +9 が消え、狙いと正反対に安全化していた。"
    - "overknow が設計の想定を大きく超えた。閾値2で敗北確定の値に対し、自由行動に +1 が9箇所あり実測で最大8。第四章の尋問が開始前に決着していた。自由行動由来を上限2へ再調整した。"
    - "END解説が logs.joint_reasoning の内部ID（b1_true 等）をそのまま表示していた。今回の改修の発端になった内部ID漏洩と同じ問題を、最も印象に残る画面で起こしていた。"
    - "gazeValue の式が rebuttal と endings-meta に二重実装されていた。片方だけ調整すると尋問画面とEND画面で数値が食い違う。"
    - "danzai ペルソナを作り index.js へ登録したのに、実行.sh のID列挙3箇所が未更新で all から漏れていた。B-2 の踏破が測定されないままだった。"
    - "chapterSummary の終端検査が空回りしていた（操作関数が空・条件が常に真）。出力の『0操作で終端』は終端したのではなく一度も動かしていないという意味だった。"
  note: "全トラックが自己検証を『全て成功』と報告した。上記のうち実ブラウザで確定したのは2件、残りはコード読解と実測値の突き合わせで発見した。症状はいずれも例外ではなく沈黙だった。"

known_findings:
  - id: "B-2の踏破は失敗経由でしか測れていなかった"
    detail: "基準線で kanjou と shoshinsha が踏んでいたB-2は、札を揃えたうえで断罪や沈黙を選ぶ積極的な未完ではなく、崩せないノードに当たって降りる失敗経由だった（actInference が .parts-close を押し inference:skipped-unbreakable-node を残す）。自由行動の調整でこの2体が three_plans を得て11ノード全てを崩せるようになった結果、最終選択へ到達しB-1になり、B-2の踏破が消えた。ゲーム側の退行ではなくペルソナが強くなった副作用であり、同時に測定側の穴の露出でもある。既存ペルソナの採点を変えて基準線を取り繕うことはせず、断罪を選ぶ playstyle のペルソナを1体足して埋めた。"

residual_risk:
  - "GitHub Actionsは未設定のため、検証結果の正本はローカル実行に留まる。"
  - "検証基盤がUIのCSSクラス名と操作アルゴリズムへ密結合している構造自体は解消していない。今回はセレクタを変えずに済んだが、『押しても状態が前進しない分岐』を作れば再び無言で停止する。パート終端検査はこれを緩和するが、実ブラウザ検証の代わりにはならない。"
  - "自由行動の長文分割で本文の表示単位は変えたが、総量は削っていない。テンポの指摘に完全には答えていない。"
  - "章末サマリの札一覧は flags/items の source 文字列の前方一致に依存する。source が null の item（fountain_pen, alibi_3〜alibi_7）は章末サマリに現れない。"
  - "手毬唄ボードの二層は第二章の一番・二番でしか使われない。以降の章での運用は未実装。"
  - "gyakuten ペルソナの overknow が5に達する。自由行動由来は上限2に収めたが、尋問の反証由来を含めると閾値2を大きく超える。0/1/2 の3段階しか意味を持たない設計との乖離は残る。"

      - "本編の立ち絵3人配置と話者強調"
      - "セーブメニュー（3枠＋オート）"
      - "手帳"
      - "バックログ"
      - "回想モード（全7END）"
      - "律の手記（5頁の頁送り）"
review_result:
  found_by_orchestrator:
    - "立ち絵の表情が全人物で最大感情に偏り、平常表情7枚が未使用だった（剛蔵は23回すべて怒り／険しい）。差し戻して再配分させた。"
    - "タイトル・回想モードが .letterbox の外に描画されており、1280x720で幅約310pxへ潰れ、メニューが画面外へはみ出していた。差し戻して修正させた。"
    - "検証基盤が無言で停止していた（上記『検証基盤の追従』）。"
  note: "7トラック全てが自己検証を『全て成功』と報告したが、上記3件はいずれもcodexが観測できない領域にあり、症状は例外ではなく沈黙だった。"
residual_risk:
  - "GitHub Actionsは未設定のため、検証結果の正本はローカル実行に留まる。"
  - "音声・BGMは未実装。manifestに定義のみ存在し、統合検証は bgm_arrival / bgm_storm / se_glass の3件を欠落として報告する（プレースホルダ継続可能）。"
  - "特殊パート途中からの再開セーブは引き続き不可。"
  - "タイトル画面のEND別変化のうち、A-4の周期的クロスフェードは静止画では確認できていない。"
  - "src/data/characters.js の expressions 配列に実ファイルが存在しない表情IDが残る（sogen:cold, onda:normal/smirk, housekeeper:normal/bow, toyo:wary/sad）。今回追加した立ち絵ノードでは使用していない。"
  - "検証基盤がUIのCSSクラス名へ密結合している構造自体は解消していない。クラス名を変更すると再び無言で停止する。"

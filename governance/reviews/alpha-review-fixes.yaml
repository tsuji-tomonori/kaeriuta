change_id: alpha-review-fixes
summary: "外部レビュー指摘への対応。背景画像の取り違え修正、セーブ3枠・回想モード・手帳・周回機能の実装、立ち絵演出と画面演出の刷新"
repository:
  product: "素のHTML/CSS/JS、外部依存ゼロの倒叙ミステリーADV"
  scope: "本文約4.2万字、全7END、特殊パート5種、画像61点、AIプレイ基盤とペルソナ10体、検証ツール群"
origin:
  trigger: "公開版を実操作した外部レビュー。α版総合7/10、UI/UX 5/10、周回のしやすさ3.5/10"
  method: "Claudeがオーケストレーションと独立検証、実装はcodex exec 7トラックへ排他分割で委譲"
changes:
  - id: "背景取り違え"
    detail: "bg_dining_night.png の中身が崩落した吊り橋、bg_bridge_storm.png の中身が食堂という取り違えを修正。ファイル名とmanifestとシナリオ参照は正しく、画像の中身のみを交換した。修正前の2点は assets/bg/_原本/ へ退避。"
    verification: "PILで独立に測定（食堂: 下半分R-B=+5.62・暖色画素15.08%、吊り橋: 青優勢55.86%・高輝度画素の上半分集中98.81%）。加えてオーケストレーター側で両画像を目視確認。"
  - id: "END別背景と時刻表記"
    detail: "全ENDが bg_rooftop_dawn と『3日目・夕』固定だったものを、END別の背景・章表記・締めへ分離。A-1 hall_morning / A-2 old_road / A-3 room_fireplace / A-4 hidden_room / B-1 rooftop_dawn / B-2 library_day / B-3 corridor_night。"
  - id: "END本文の圧縮"
    detail: "結論到達後に同じ情感を言い換える段落を統合・削除。シナリオ本文 42,925字 → 41,815字（-1,110字）。条件分岐フラグは15種中14種の出現数を維持し、manuscript_left_hand のみ3→2。"
  - id: "立ち絵演出"
    detail: "台詞197件に対し立ち絵ノードが20件（第二章・第四章B・終幕は0件）だった状態を145件へ。話者未表示率0.7%。表情は平常表情を基準とし、強い表情を情動の変化点へ限定（observer:serious 20→8、goko:angry 13→4、fujino:sad 10→5）。"
  - id: "セーブとロード"
    detail: "保存形式を format 3 のメタ情報つきレコードへ変更（章名・シーン・保存日時・疑惑・確信・フラグ数）。version 2 の生stateも読める後方互換を維持。手動3枠＋オートのセーブメニュー、上書き確認、削除、空枠の無効化を追加。"
  - id: "周回機能"
    detail: "回想モード（全7END一覧・再読・進捗）、律の手記（B-1到達かつ🕯全回収で解禁、全5頁）、タイトル画面のクリア状況変化、章頭スナップショットによる章選択、バックログ、既読スキップ、オート送り、既読永続化を追加。"
  - id: "手帳の導線"
    detail: "installNotebook が実装済みでゲーム本体から一度も呼ばれていなかった。単一インスタンスのコントローラへ作り直し、HUDボタンとNキーから開けるようにした。マウント先を document.body から #game-screen へ移し、Escで閉じられるようにした。"
  - id: "画面演出"
    detail: "シナリオが指定していた transition を無視して即時差し替えしていた背景をクロスフェード化。話者強調（非話者の減光・低彩度・後退）、立ち絵の登退場と表情クロスフェード、タイプライター表示と句読点の間、選択肢の順次表示、ヴィネットと紙目を追加。立ち絵の object-fit を cover から contain へ変更（700x1200素材の横方向切り落としを解消）。"
  - id: "alert/confirmの追放"
    detail: "レターボックス演出を壊すブラウザモーダルを自前ダイアログへ置換。『タイトルへ』を無確認の location.reload() から確認ダイアログ経由に変更。"
  - id: "検証基盤の追従"
    detail: "UI刷新でタイトル直下のクラスが .title-screen から .kaeriuta-title へ変わり、tools/ブラウザ検証/進行基盤.js が [data-start] を永久に押さなくなっていた。結果は status=stalled / visitedScenes=[] / errors=[] で、例外を出さずに停止していた。10ペルソナが同じ startProgression を共有するため、この状態では『全7ENDを実プレイで踏破できる』基準線が測定不能だった。セレクタを追従させ、結果JSONへ screen / stalledScreen / stallReason を追加。"
requirement_impact:
  judgement: "あり"
  requirement_ids: "none（要件IDは未整備）"
  reason: "利用者向け挙動が広範に変わる。END本文が約束していた回想モード・タイトル変化・律の手記が実際に発生するようになり、セーブ2・3への保存手段と手帳の参照手段が新設された。背景の取り違え修正は表示される画像そのものを変える。"
design_impact:
  judgement: "あり"
  targets: "公開契約、as-built構造"
  detail:
    - "保存形式に format 3 を追加（version 2 は後方互換で読める）"
    - "localStorage キー kaeriuta-progress を新設（周回進捗・既読・章スナップショット・設定）"
    - "src/ui/message-window.js の show() 第3引数が boolean に加えて 'stage' を取る"
    - "src/ui/character-layer.js に setSpeaker() を追加"
    - "src/ui/screen.js の setBackground() が第3引数 options を取る"
    - "src/main.js を単一ファイルの実行ループから、セッション管理つきの構成へ再編し initializeApp / nodeKeyFromState / saveChapterSnapshot を公開"
    - "新規モジュール: engine/progress.js, engine/playback.js, data/chapters.js, data/endings-meta.js, data/records.js, ui/hud.js, ui/backlog.js, ui/dialog.js, ui/gallery.js, ui/save-menu.js, styles/menu.css, styles/hud.css"
  adr: "不要。長期の設計判断を新たに固定していない。章選択をスナップショット方式にした判断のみ本YAMLへ記録する。"
design_decisions:
  - decision: "章選択は新規stateではなく章頭スナップショットからの再開とする"
    reason: "フラグ・証拠・パラメータが空のまま第四章へ入るとEND到達条件が破綻し、END本文が所持していない証拠を語る。本作は過去に同種の破綻を起こしている。スナップショットが無い章は disabled とし理由を表示する。"
  - decision: "霧原律を栞の母としない"
    reason: "指示書は『栞の母』としていたが、plan/登場人物表.md と本編B-1が一貫して63歳男性と定義している。既存本編との整合を優先した。"

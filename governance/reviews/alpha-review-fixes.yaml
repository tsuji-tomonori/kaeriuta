  github_actions: "未設定"
  source_of_truth: "ローカル実行結果。CIは未設定のためPassとして扱わない。"
  note: "codexはサンドボックスでChromeを起動できないため、実ブラウザ検証・スクリーンショット・AIプレイは全てオーケストレーター側で実行した。"
  checks:
    - command: "node --test"
      result: "53件全通過、fail 0"
    - command: "node tools/シナリオ検証.mjs"
      result: "不整合0件"
    - command: "node tools/統合検証.mjs"
      result: "13シーン・7END・遷移を確認"
    - command: "node tools/到達可能性検査.mjs"
      result: "通過"
    - command: "node tools/END到達条件検査.mjs"
      result: "全7END到達可能（ブロック予算込み）"
    - command: "bash tools/構文検査.sh"
      result: "63ファイル・エラー0"
    - command: "python3 tools/透過検品.py"
      result: "33点全合格、輪郭紫0px"
    - command: "python3 tools/構図検査.py"
      result: "頭部比率 平均28.2% / 平均からの最大差1.3pt"
    - command: "bash tools/ブラウザ検証/実行.sh"
      result: "実行ルート→A-4 / 告白ルート→B-1、errors 0"
    - command: "bash tools/AIプレイ/実行.sh all"
      result: "10ペルソナ全完走、全7END到達（a1/a2/a3/a4/b1/b2/b3）、例外0、既定動作率 最大4.5%"
  visual_verification:
    method: "google-chrome --headless=new でindex.htmlを実操作し1280x720で撮影"
    confirmed:

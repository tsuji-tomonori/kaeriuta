name: Regenerate PR 38 audio

on:
  push:
    branches:
      - agent/audio-soundtrack
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    if: ${{ !contains(github.event.head_commit.message, '[audio-profile-rendered]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check numpy scipy
      - name: Render and validate soundtrack
        run: |
          tools/audio/render.sh
          python3 tools/audio/check_audio.py
          node --test test/*.test.js
      - name: Publish generated audio
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/regenerate-pr38-audio.yml
          git add assets/audio docs/audio/render-report.json
          git commit -m "regenerate scene-specific soundtrack [audio-profile-rendered]"
          git push origin HEAD:agent/audio-soundtrack

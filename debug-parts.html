<!doctype html><meta charset="utf-8"><title>帰り唄・特殊パート検証</title>
<style>body{margin:2rem;background:#101216;color:#f4efd9;font-family:serif}button{margin:.25rem;padding:.6rem;background:#26323a;color:#f4efd9;border:1px solid #c9b77c}pre{white-space:pre-wrap}</style>
<h1>特殊パート単体検証</h1><p>「完全」は全カード、「長文」は各パートのスクロール確認用です。</p>
<button data-part="rebuttal">反論（第二章）</button><button data-part="rebuttal4">反論（第四章A）</button><button data-part="jointReasoning">共同推理</button><button data-part="freeAction">自由行動</button><button data-part="temariBoard">手毬唄ボード</button><button id="long-preset">長文プリセット</button><button id="preset">完全プリセット</button><button id="notebook">手帳</button><pre id="state"></pre>
<script type="module">
import {parts} from './src/systems/index.js'; import {flags} from './src/data/flags.js'; import {items} from './src/data/items.js'; import {chapter2} from './src/data/scenario/chapter2.js'; import {openNotebook,installNotebook} from './src/systems/notebook/index.js';
const q=document.querySelector('#state'), long='長文表示を確認するための検証用テキストです。館の廊下に残る足音と、手帳の余白に書かれた小さな違和感を一つずつ確かめる。';
let state={params:{conviction:52,suspicion:10,overknow:0,agitation:0,narrator:0,conscience:0,trust:0},flags:{past:[],plan:['other_plan'],alive:[]},items:['serving_roster','cleanup_card','kitchen_menu','reading_record'],logs:{},testimonyLog:[]};
const apply=e=>{if(e.t==='param')state.params[e.key]=(state.params[e.key]||0)+e.delta;if(e.t==='item'&&!state.items.includes(e.id))state.items.push(e.id);if(e.t==='log')state.logs[e.key]=e.value;if(e.t==='flag'){const d=flags[e.id];if(d&&!state.flags[d.line].includes(e.id))state.flags[d.line].push(e.id)}};
const boardArgs=chapter2.nodes.find(node=>node.t==='call'&&node.part==='temariBoard')?.args||{};
function show(){q.textContent=JSON.stringify(state,null,2)}
function longArgs(name){if(name==='freeAction')return{day:1,blocks:2,actions:[{id:'long-a',label:'長文の場面を読む',desc:'表示検証',narrative:long.repeat(10),reward:[],risk:[]},{id:'long-b',label:'次の長文を読む',desc:'表示検証',narrative:long.repeat(8),reward:[],risk:[]}]};if(name==='rebuttal')return{id:'rebuttal_ch2',title:'長文・反論',initialConviction:50,nodes:[{id:'long',type:'主張',claim:long.repeat(7),responses:[{kind:'silence',label:'確認する',result:{effects:[]}}]}]};if(name==='jointReasoning')return{debugData:{phases:[{nodes:[{id:'n1',phase:'p1',claim:long.repeat(7),requirements:[['missing']],conanProxy:true,relicBonus:false,agitation:0}]}],final:{choices:[{ending:'b2_unfinished',id:'long',label:'閉じる'}]}}};if(name==='temariBoard')return{debugVerses:Array.from({length:6},(_,i)=>`${i+1}番　${long.repeat(3)}`),cards:['onda']};return{}}
async function run(name,longMode=false){let args=name==='rebuttal4'?{id:'day3_show'}:name==='rebuttal'?{id:'rebuttal_ch2'}:name==='freeAction'?{day:1,blocks:3}:name==='temariBoard'?boardArgs:{};if(longMode)args=longArgs(name);const r=await parts[name==='rebuttal4'?'rebuttal':name].start({state},args);r.effects.forEach(apply);show()}
document.querySelectorAll('[data-part]').forEach(b=>b.onclick=()=>run(b.dataset.part)); document.querySelector('#long-preset').onclick=()=>{const names=['freeAction','rebuttal','jointReasoning','temariBoard'];let i=0;const next=()=>i<names.length&&run(names[i++],true).then(next);next()};
document.querySelector('#preset').onclick=()=>{state.flags={past:Object.values(flags).filter(x=>x.line==='past').map(x=>x.id),plan:Object.values(flags).filter(x=>x.line==='plan').map(x=>x.id),alive:Object.values(flags).filter(x=>x.line==='alive').map(x=>x.id)};state.items=Object.keys(items).concat(['alibi_1','alibi_2','alibi_3','alibi_4','alibi_5','alibi_6','alibi_7']);show()}; document.querySelector('#notebook').onclick=()=>openNotebook({state});installNotebook({state});show();
</script>
